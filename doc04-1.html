<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
        ol li {list-style-type: lower-alpha;}
        ol {list-style-position: inside;}
        ul {list-style-position: outside;}
        li.kor {list-style-type: square;}
        li.usa {list-style-image: url(.gif);}
        p {background-color: aqua; transition: background-color 5s;}
        ul {background-color: brown;}
        ol {background-color: red;}
        li {background-color: lightgray;}
        </style>
    </head>
    <body>
        <p>순서가 없는 목록</p>
        <ul>
            <li class="usa">첫 번째</li>
            <li class="kor">두 번째</li>
            <li class="jpn">세 번째</li>
        </ul>

        <p>순서가 있는 목록 </p>
        <ol>
            <li>첫 번째</li>
            <li>두 번째</li>
            <li>세 번째</li>
        </ol>
    </body>
</html>
